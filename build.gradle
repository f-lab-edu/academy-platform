plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.11-SNAPSHOT'
    id 'io.spring.dependency-management' version '1.1.6'
    id "org.asciidoctor.jvm.convert" version "3.3.2"
    id 'jacoco'
}

group = 'spring'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    asciidoctorExtensions
    compileOnly {
        extendsFrom annotationProcessor
    }
    configureEach {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }

}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/snapshot' }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // redis 연동
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // redis에 세션을 저장하기 위한 의존성
    implementation 'org.springframework.session:spring-session-data-redis'

    // log4j2 적용
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    // p6spy 설정
    implementation 'p6spy:p6spy:3.9.1'
    implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.9.0'

    // queryDsl 관련 코드생성 기능 제공
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    // queryDsl 라이브러리
    annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    implementation 'org.mindrot:jbcrypt:0.4'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok' // 테스트 의존성 추가
    testAnnotationProcessor 'org.projectlombok:lombok' // 테스트 의존성 추가

    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // TestContainers Core
    testImplementation 'org.testcontainers:testcontainers:1.20.3'
    // TestContainers MariaDB 모듈
    testImplementation 'org.testcontainers:mariadb:1.19.0'
    // TestContainers redis 모듈
    testImplementation "com.redis.testcontainers:testcontainers-redis-junit:1.6.4"
    // TestContainers Spring Extension
    testImplementation 'org.testcontainers:junit-jupiter:1.19.0'

    // build/generated-snippets 에 생긴 .adoc 조각들을 프로젝트 내의 .adoc 파일에서 읽어들일 수 있도록 연동해줍니다.
    // 이 덕분에 .adoc 파일에서 operation 같은 매크로를 사용하여 스니펫 조각들을 연동할 수 있는 것입니다.
    // 그리고 최종적으로 .adoc 파일을 HTML로 만들어 export 해줍니다.
    asciidoctorExtensions 'org.springframework.restdocs:spring-restdocs-asciidoctor'

    // restdocs-mockmvc의 testCompile 구성 -> mockMvc를 사용해서 snippets 조각들을 뽑아낼 수 있게 된다.
    // MockMvc 대신 WebTestClient을 사용하려면 spring-restdocs-webtestclient 추가
    // MockMvc 대신 REST Assured를 사용하려면 spring-restdocs-restassured 를 추가
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'


}

ext {
    // snippetsDir 변수를 build/generated-snippets 디렉토리로 설정합니다.
    // 이 디렉토리는 테스트 중에 생성된 문서 스니펫 파일들이 저장되는 위치
    snippetsDir = file('build/generated-snippets')
}

test {
    // 테스트 실행 시 생성된 스니펫 파일들을 snippetsDir에 출력합니다.
    outputs.dir snippetsDir
    finalizedBy 'jacocoTestReport'
    useJUnitPlatform()
}

asciidoctor {
    // asciidoctor 작업은 test 작업이 완료된 후 실행됩니다. 이는 스니펫 파일들이 먼저 생성되어야 하기 때문입니다.
    dependsOn test
    // Asciidoctor 확장 기능을 위한 의존성을 설정합니다.
    configurations 'asciidoctorExtensions'
    // 문서 생성 시 필요한 스니펫 파일들이 위치한 디렉토리를 input으로 지정
    inputs.dir snippetsDir

    // source가 없으면 .adoc파일을 전부 html로 만들어버림
    // source 지정시 특정 adoc만 HTML로 만든다.
    sources {
        include("**/index.adoc", "**/common/*.adoc")
    }

    // 소스 파일의 디렉토리 구조를 기반으로 빌드 디렉토리의 기본 디렉토리를 설정합니다.
    baseDirFollowsSourceFile()
}

// Asciidoctor 작업 전 준비 단계
// asciidoctor 작업이 실행되기 전에 기존의 static/docs 디렉토리를 삭제하고, 새로 생성합니다. 이는 이전 문서 파일들이 남아있지 않도록 보장합니다
asciidoctor.doFirst {
    delete file('src/main/resources/static/docs')
    file('src/main/resources/static/docs').mkdirs()
}

// asciidoctor 작업 이후 생성된 HTML 파일을 static/docs로 copy
tasks.register('copyDocument', Copy) {
    dependsOn asciidoctor // copyDocument 작업은 asciidoctor 작업이 완료된 후 실행됩니다.
    from file("build/docs/asciidoc/index.html")
    into file("src/main/resources/static/docs")

}

// build 작업이 실행될 때 copyDocument 작업도 함께 실행되도록 설정합니다.
// 빌드 과정에서 항상 최신 문서가 포함되도록 보장함.
tasks.named('build') {
    dependsOn copyDocument
}

// bootJar 작업이 copyDocument 작업에 의존하도록 설정하여, JAR 파일 생성 시 최신 문서가 포함되도록 합니다.
bootJar {
    dependsOn copyDocument
    from("build/docs/asciidoc/index.html") {
        into 'static/docs'
    }
}
// jacoco 설정
jacoco {
    toolVersion = "0.8.11"
}

// jacocoTestReport를 생성할 파일종류와 경로지정
jacocoTestReport {
    reports {
        xml.required.set(true)
        csv.required.set(true)
        html.required.set(true)

        xml.destination file(project.layout.buildDirectory.dir("jacoco/index.xml")) as File
        csv.destination file(project.layout.buildDirectory.dir("jacoco/index.csv")) as File
        html.destination file(project.layout.buildDirectory.dir("jacoco/index.html")) as File

    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it,
                    exclude: ['spring/academyPlatform/global/**',
                              'spring/academyPlatform/AcademyPlatformApplication.class',
                              '**/*dto*/**',
                              '**/*domain*/**',
                              '**/*dao*/**',
                              '**/*mapper*/**',
                              '**/*model*/**'])
        }))
    }

}

jacocoTestCoverageVerification {
    def Qdomains = []
    for (qPattern in '**/QA'..'**/QZ') {
        Qdomains.add(qPattern + '*')
    }

    violationRules {
        rule {
            enabled = true // 활성화
            element = 'CLASS' // 클래스 단위로 커버리지 체크

            // 라인 커버리지 제한을 80%로 설정
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }

            // 브랜치 커버리지 제한을 80%로 설정
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }

            excludes = ['../global/**',
                        '../AcademyPlatformApplication.class',
                        '**/*dto*/**',
                        '**/*domain*/**',
                        '**/*dao*/**',
                        '**/*mapper*/**',
                        '**/*model*/**'] + Qdomains
        }

    }
}

tasks.named('test') {
    useJUnitPlatform()
}
